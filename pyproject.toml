[project]
name = "usra"
version = "0.1.0"
description = "Summer USRA 2026 project"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "boto3>=1.42.97",
    "bs4>=0.0.2",
    "dspy>=2.6.27",
    "grobid-client-python>=0.1.4",
    "grobid-tei-xml>=0.1.3",
    "litellm>=1.83.0",
    "matplotlib>=3.9.4",
    "nbformat>=5.10.4",
    "neo4j>=6.2.0",
    "nltk>=3.9.2",
    "numpy<2",
    "onnxruntime==1.19.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "pydantic>=2.13.3",
    "pymupdf>=1.26.5",
    "pyvis>=0.3.2",
    "requests>=2.32.5",
    "saxonche>=13.0.0",
    "spacy>=3.8.14",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.3",
    "wizmap>=0.1.7",
    "wtpsplit>=2.2.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
